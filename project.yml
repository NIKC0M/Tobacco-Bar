# XcodeGen alternative to the checked-in HybridAthlete.xcodeproj.
#
#   brew install xcodegen && xcodegen generate
#
# Both routes produce an equivalent project; use whichever you prefer. The
# checked-in project is generated by Scripts/generate_xcodeproj.py and needs no
# extra tooling.

name: HybridAthlete
options:
  bundleIdPrefix: app.hybridathlete
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  HybridAthlete:
    type: application
    platform: iOS
    sources:
      - path: HybridAthlete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hybridathlete.ios
        INFOPLIST_FILE: HybridAthlete/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: HybridAthlete/Resources/HybridAthlete.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  HybridAthleteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: HybridAthlete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hybridathlete.ios.tests
        GENERATE_INFOPLIST_FILE: YES
